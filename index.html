<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha Check</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Alpha Check</h1>

      <div class="controls">
        <label for="game-mode">
          Mode
          <select id="game-mode">
            <option value="time">Time</option>
            <option value="questions">Questions</option>
          </select>
        </label>

        <label for="game-length">
          <span id="game-length-label">Duration</span>
          <select id="game-length"></select>
        </label>

        <label for="difficulty">
          Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="hard">Hard</option>
            <option value="super-hard">Super Hard</option>
          </select>
        </label>

        <label id="custom-value-field" for="custom-value" hidden>
          <span id="custom-value-label">Seconds</span>
          <input id="custom-value" type="number" min="1" step="1" inputmode="numeric" />
        </label>

        <button id="play" type="button">Play</button>
        <span id="session-status" role="status" aria-live="polite" hidden></span>

        <button
          id="theme-toggle"
          class="icon-button"
          type="button"
          aria-label="Theme: System"
          title="Theme: System"
        >
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <main class="game-area">
      <canvas id="canvas" aria-label="Game canvas"></canvas>
      <div class="canvas-hud" aria-live="polite">
        <div id="question-prompt" class="question-prompt" hidden></div>
        <div id="game-message" class="game-message" hidden></div>
        <button id="next-question" class="next-button" type="button" hidden>Next</button>
      </div>
    </main>
  </body>
</html>
